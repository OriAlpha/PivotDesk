name: CI

# Gate every PR before it lands on main: lint + format check + the full
# no-network test suite. The tests monkeypatch the fetchers, so CI never
# touches Yahoo Finance and needs no secrets.
on:
  pull_request:
    branches: [main]
  # Also run on pushes to main itself, so a direct push or a merged PR is
  # confirmed green after the fact.
  push:
    branches: [main]

# Cancel a superseded run on the same ref so re-pushing a branch doesn't
# queue up duplicate jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          # Pin the installer for reproducibility; the uv version itself is
          # whatever setup-uv resolves for the pin.
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        # --dev pulls in pytest and ruff (the [dependency-groups].dev list).
        # requirements.txt is for Streamlit Community Cloud and is irrelevant here.
        run: uv sync --dev --python 3.11

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        # --check is non-mutating; fails the job if formatting would change.
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest
