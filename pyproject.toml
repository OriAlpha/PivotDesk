[project]
name = "pivotdesk"
version = "0.1.0"
description = "Live pivot-point dashboard for NSE stocks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # st.iframe and st.number_input(value=None) are both well past 1.37;
    # the app raises AttributeError on older releases.
    "streamlit>=1.59,<2",
    "yfinance>=1.5,<2",
    "pandas>=2.2,<4",
    "curl-cffi>=0.13,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    # Linter/formatter. Added to the dev group so it never reaches
    # requirements.txt (Streamlit Community Cloud exports with --no-dev).
    "ruff>=0.6,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Safe, low-opinion set: pycodestyle errors (E), pyflakes (F), import sorting (I).
# No stylistic nitpicks (those live in `ruff format`), no preview rules.
select = ["E", "F", "I"]
# E501 (line too long): `ruff format` already wraps real code. The remaining
# long lines live inside HTML/CSS string literals and f-strings that cannot be
# split without breaking them, so the rule only nags on strings it can't fix.
ignore = ["E501"]
